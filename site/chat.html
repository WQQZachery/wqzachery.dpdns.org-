let myNick=LS.get('chatNick','')||pick(A)+pick(B);LS.set('chatNick',myNick);
let me={uid:'',nick:myNick},ws=null,tries=0,rt=0,ready=false,fatal=false,pingT=0;
let pub=[],online={n:0,users:[]},dms={},view=null,pubUnread=0,mentions=0,clearTs=+LS.get('chatClear','0')||0;
let seen={};try{seen=JSON.parse(LS.get('chatSeen','{}'))||{}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return h%360};
const avc=id=>`background:linear-gradient(135deg,hsl(${hue(id)} 58% 30%),hsl(${(hue(id)+40)%360} 58% 24%))`;
const ini=n=>[...String(n||'?')].find(c=>c.trim())||'?';
function md(t){return esc(t).split(/(`[^`\n]+`)/).map((x,i)=>i%2?'<code>'+x.slice(1,-1)+'</code>':x.replace(/(?<!\*)\*\*(?!\*)([^*\n]+?)(?<!\*)\*\*(?!\*)/g,'<b>$1</b>').replace(/https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?，。！？)）]/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer nofollow">${u}</a>`).replace(/(^|[\s>])@([^\s@<]{1,16})/g,(m,p,n)=>p+'<span class="at">@'+n+'</span>')).join('')}
const mentionsMe=m=>m.uid!==me.uid&&me.nick&&(' '+m.text).includes('@'+me.nick);
function rel(ts){const s=(Date.now()-ts)/1000;if(s<60)return'刚刚';if(s<3600)return Math.floor(s/60)+'分钟前';if(s<86400)return Math.floor(s/3600)+'小时前';
  const d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function post(m){window.__post&&window.__post(m)}

/* ---------- rendering ---------- */
const near=()=>log.scrollHeight-log.scrollTop-log.clientHeight<120;
const down=()=>{log.scrollTop=log.scrollHeight;requestAnimationFrame(()=>{log.scrollTop=log.scrollHeight});hideNew()};
function hideNew(){$('#newp').classList.remove('on','at');if(mentions){mentions=0;badge()}}
function showNew(at){const p=$('#newp');p.textContent=at?'有人 @ 了你 ↓':'新消息 ↓';p.classList.toggle('at',!!at||p.classList.contains('at'));p.classList.add('on')}
let stick=true;
log.addEventListener('scroll',()=>{stick=near();if(stick)hideNew()},{passive:true});
new ResizeObserver(()=>{if(stick)log.scrollTop=log.scrollHeight}).observe(log);   // keyboard / input bar resize keeps the bottom pinned
send.addEventListener('pointerdown',e=>{if(document.activeElement===inp)e.preventDefault()});   // tapping send keeps the keyboard open
$('#newp').onclick=()=>down(true);
function rowEl(m,prev,anim){
  if(m.sys){const d=document.createElement('div');d.className='sys'+(anim?' new':'');d.textContent=m.text;return d}
  const mine=m.uid===me.uid,cont=prev&&!prev.sys&&prev.uid===m.uid&&m.ts-prev.ts<180000;
  const d=document.createElement('div');d.className='row'+(mine?' mine':'')+(cont?' cont':'')+(anim?' new':'')+(m.pend?' pend':'')+(m.fail?' fail':'');
  d.dataset.id=m.id||'';if(m.cid)d.dataset.cid=m.cid;
  d.innerHTML=`<button class="av" type="button" style="${avc(m.uid)}" data-u="${esc(m.uid)}" data-n="${esc(m.nick)}" aria-label="${esc(m.nick)}">${esc(ini(m.nick))}</button><div class="col"><div class="meta">${mine?'':`<b data-u="${esc(m.uid)}" data-n="${esc(m.nick)}">${esc(m.nick)}</b>`}<time data-ts="${m.ts}">${rel(m.ts)}</time></div><div class="bub${mentionsMe(m)?' ment':''}">${md(m.text)}</div>${mine?`<div class="tick">${m.fail?'发送失败':m.pend?'发送中…':'已发送 ✓'}</div>`:''}</div>`;
  return d}
const listFor=()=>view?(dms[view]?dms[view].msgs:[]):pub.filter(m=>m.sys?m.ts>clearTs:m.ts>clearTs);
function render(){
  if(!ready&&!view){inner.innerHTML=Array.from({length:6},(_,i)=>`<div class="sk" style="${i%3===2?'flex-direction:row-reverse':''}"><span class="av"></span><i style="width:${[46,62,38,55,30,50][i]}%"></i></div>`).join('');return}
  const L=listFor();inner.innerHTML='';
  if(!L.filter(m=>!m.sys).length){
    const e=document.createElement('div');e.className='empty';
    e.innerHTML=view?`<div class="e">✉️</div><h2>开始私聊吧</h2><p>消息只有你们两个人能看到。</p>`:`<div class="e">👋</div><h2>${clearTs&&pub.length?'屏幕已清空':'还没有人说话'}</h2><p>${clearTs&&pub.length?'之后的新消息会继续显示在这里。':'来打个招呼吧，第一条消息由你开始。'}</p><div class="sug"><button type="button">大家好！👋</button><button type="button">有人在吗？</button><button type="button">今天过得怎么样？</button></div>`;
    inner.appendChild(e);e.querySelectorAll('.sug button').forEach(b=>b.onclick=()=>{inp.value=b.textContent;submit()});
    L.filter(m=>m.sys).forEach(m=>inner.appendChild(rowEl(m)));
  } else {let prev=null;for(const m of L){inner.appendChild(rowEl(m,prev));prev=m}}
  down()}
function append(m){const st=near(),L=listFor();
  if(inner.querySelector('.empty,.sk')){render();return}
  const prev=L[L.length-2];inner.appendChild(rowEl(m,prev,true));
  if(st||m.uid===me.uid)down(true);else if(!m.sys)showNew(mentionsMe(m))}
setInterval(()=>document.querySelectorAll('time[data-ts]').forEach(t=>{t.textContent=rel(+t.dataset.ts)}),30000);

/* ---------- presence ---------- */
function setOnline(o){const old=online.n;online=o;const tx=$('#ontx');
  if(!ws||ws.readyState!==1)return;
  tx.innerHTML=`当前在线 <span class="n">${o.n}</span> 人`;if(o.n!==old&&!reduce){const n=tx.querySelector('.n');n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump')}
  if($('#sheet').classList.contains('on')&&$('#pan').dataset.k==='on')sheetOnline()}
function setStatus(kind,txt){const on=$('#on');on.className=kind==='ok'?'':kind==='wait'?'wait':'off';
  const st=$('#status');if(kind==='ok'){st.classList.remove('on');setOnline(online);return}
  $('#ontx').textContent=kind==='wait'?'连接中…':'已断开';st.className='on'+(kind==='bad'?' bad':'');st.innerHTML=esc(txt)+(kind==='bad'?'<button type="button" id="rc">立即重连</button>':'');
  const rc=$('#rc');if(rc)rc.onclick=()=>{fatal=false;tries=0;connect()}}

/* ---------- unread / badges ---------- */
function dmUnread(){let n=0;for(const k in dms)n+=dms[k].unread||0;return n}
function badge(){const n=dmUnread(),b=$('#dmbadge');b.hidden=!n;b.textContent=n>99?'99+':n;
  $('#pubn').textContent=view&&pubUnread?'大厅 '+pubUnread+' 条新消息':'';
  post({type:'badge',tab:'chat',n:n+mentions})}
function markSeen(uid){const c=dms[uid];if(!c)return;c.unread=0;seen[uid]=Date.now();LS.set('chatSeen',JSON.stringify(seen));badge()}

/* ---------- socket ---------- */
function connect(){clearTimeout(rt);if(ws&&ws.readyState<2)return;
  setStatus('wait','正在连接…');
  const u=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/chat/ws?key='+encodeURIComponent(key)+'&nick='+encodeURIComponent(me.nick);
  let s;try{s=new WebSocket(u)}catch(e){return retry()}ws=s;
  const cto=setTimeout(()=>{if(s.readyState===0){tries=Math.max(tries,1);try{s.close()}catch(e){}}},10000);   // no answer in 10 s → treat as failed, show retry
  s.onopen=()=>{clearTimeout(cto);tries=0;clearInterval(pingT);pingT=setInterval(()=>{if(s.readyState===1)s.send('ping')},25000)};
  s.onmessage=e=>{if(e.data==='pong')return;let m;try{m=JSON.parse(e.data)}catch(_){return}on(m)};
  s.onclose=e=>{clearTimeout(cto);clearInterval(pingT);if(ws!==s)return;ws=null;pending.forEach(p=>failMsg(p.cid));pending.clear();
    if(e.code===4029||fatal){fatal=true;setStatus('bad','连接数太多，已停止重连');return}retry()};
  s.onerror=()=>{}}
function retry(){const d=Math.min(30000,1000*2**tries)*(0.75+Math.random()*.5);tries++;
  setStatus(tries>1?'bad':'wait',tries>1?`已断开，${Math.round(d/1000)} 秒后重连`:'连接中…');rt=setTimeout(connect,d)}
addEventListener('online',()=>{if(!ws){tries=0;connect()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ws&&!fatal){tries=0;connect()}});
const pending=new Map();
function on(m){
  if(m.t==='hello'){me=m.me;myNick=me.nick;LS.set('chatNick',myNick);meBtn();ready=true;
    const loc=pub.filter(x=>x.sys);pub=m.history.concat(loc.filter(x=>x.ts>(m.history.length?m.history[m.history.length-1].ts:0))).sort((a,b)=>a.ts-b.ts);
    for(const d of m.dms){const other=d.uid===me.uid?d.to_uid:d.uid,nick=d.uid===me.uid?d.to_nick:d.nick;const c=dms[other]||(dms[other]={nick,msgs:[],loaded:false,unread:0});c.nick=nick;c.last=d;
      if(d.uid!==me.uid&&d.ts>(seen[other]||0)&&view!==other)c.unread=Math.max(c.unread,1)}
    if(view)ws.send(JSON.stringify({t:'dmhist',with:view}));
    setStatus('ok');setOnline({n:m.n,users:m.users});render();badge();return}
  if(m.t==='presence'){setOnline(m);return}
  if(m.t==='msg'){const x=m.m;
    if(m.cid&&pending.has(m.cid))pending.delete(m.cid);
    if(x.to_uid){const other=x.uid===me.uid?x.to_uid:x.uid,nick=x.uid===me.uid?x.to_nick:x.nick;const c=dms[other]||(dms[other]={nick,msgs:[],loaded:false,unread:0});c.nick=nick;c.last=x;
      replaceOrPush(c.msgs,x,m.cid,view===other);
      if(view===other)markSeen(other);else if(x.uid!==me.uid){c.unread=(c.unread||0)+1;badge();toast('💬 '+x.nick+' 给你发来私信')}
      if($('#sheet').classList.contains('on')&&$('#pan').dataset.k==='dm')sheetDM();return}
    replaceOrPush(pub,x,m.cid,!view);
    if(view&&x.uid!==me.uid){pubUnread++;badge()}
    if(mentionsMe(x)&&(view||!near()||document.hidden||away)){mentions++;badge();if(view)toast('🔔 '+x.nick+' 在大厅 @ 了你')}
    return}
  if(m.t==='sys'){const x={sys:1,text:m.text,ts:Date.now()};pub.push(x);if(pub.length>160)pub.shift();if(!view)append(x);return}
  if(m.t==='typing'){if(m.uid===me.uid)return;if((m.to||'')!==''&&view!==m.uid)return;if(!m.to&&view)return;typingShow(m.nick);return}
  if(m.t==='nick'){for(const x of pub)if(x.uid===m.uid)x.nick=m.nick;if(dms[m.uid])dms[m.uid].nick=m.nick;
    if(m.uid===me.uid){me.nick=m.nick;myNick=m.nick;LS.set('chatNick',m.nick);meBtn();toast('昵称已改为 '+m.nick)}
    if(view===m.uid)$('#dmname').textContent=m.nick;return}
  if(m.t==='dmhist'){const c=dms[m.with]||(dms[m.with]={nick:'',msgs:[],unread:0});c.msgs=m.msgs.concat(c.msgs.filter(x=>x.pend||x.fail));c.loaded=true;if(view===m.with){render();markSeen(m.with)}return}
  if(m.t==='del'){const rm=a=>{const i=a.findIndex(x=>x.id===m.id);if(i>=0)a.splice(i,1)};rm(pub);for(const k in dms)rm(dms[k].msgs);const el=inner.querySelector(`.row[data-id="${m.id}"]`);if(el)el.remove();return}
  if(m.t==='err'){if(m.fatal)fatal=true;if(m.cid)failMsg(m.cid,m.msg);toast(m.msg);return}
}
function replaceOrPush(arr,x,cid,visible){
  if(cid){const i=arr.findIndex(y=>y.cid===cid);if(i>=0){arr[i]=x;if(visible){const el=inner.querySelector(`.row[data-cid="${cid}"]`);if(el){el.dataset.id=x.id;el.classList.remove('pend');const t=el.querySelector('.tick');if(t)t.textContent='已发送 ✓';const tm=el.querySelector('time');if(tm)tm.dataset.ts=x.ts}}return}}
  if(arr.some(y=>y.id===x.id))return;arr.push(x);if(arr.length>(arr===pub?160:80))arr.shift();if(visible)append(x)}
function failMsg(cid,why){const all=[pub,...Object.values(dms).map(c=>c.msgs)];for(const a of all){const x=a.find(y=>y.cid===cid);if(x){x.pend=0;x.fail=1}}
  const el=inner.querySelector(`.row[data-cid="${cid}"]`);if(el){el.classList.remove('pend');el.classList.add('fail');const t=el.querySelector('.tick');if(t)t.textContent=(why?why+' · ':'')+'发送失败'}}

/* ---------- typing ---------- */
const typers=new Map();let typT=0;
function typingShow(n){typers.set(n,Date.now()+3500);typingPaint();clearTimeout(typT);typT=setTimeout(typingPaint,3600)}
function typingPaint(){const now=Date.now();for(const [k,v] of typers)if(v<now)typers.delete(k);const ns=[...typers.keys()],e=$('#typing');
  e.classList.toggle('on',ns.length>0);if(ns.length)e.textContent=(ns.length>2?ns.slice(0,2).join('、')+' 等 '+ns.length+' 人':ns.join('、'))+' 正在输入'}
let lastTyp=0;
inp.addEventListener('input',()=>{grow();const now=Date.now();if(inp.value.trim()&&now-lastTyp>2500&&ws&&ws.readyState===1){lastTyp=now;ws.send(JSON.stringify({t:'typing',to:view||''}))}});

/* ---------- send ---------- */
const grow=()=>{inp.style.height='auto';inp.style.height=Math.min(120,inp.scrollHeight)+'px';send.disabled=!inp.value.trim();const n=[...inp.value].length;$('#cnt').textContent=n>400?n+'/500':'';fh()};
function submit(){const t=inp.value.trim();if(!t)return;
  if(!ws||ws.readyState!==1){toast('还没连上，正在重连…');if(!ws){tries=0;connect()}return}
  if([...t].length>500)return toast('消息太长了，最多 500 字');
  const cid=Math.random().toString(36).slice(2,10),x={cid,uid:me.uid,nick:me.nick,text:t,ts:Date.now(),pend:1};
  const msg={t:'msg',text:t,cid};
  if(view){msg.to=view;msg.toNick=dms[view]&&dms[view].nick;x.to_uid=view;dms[view].msgs.push(x)}else pub.push(x);
  pending.set(cid,x);ws.send(JSON.stringify(msg));append(x);
  setTimeout(()=>{if(pending.has(cid)){pending.delete(cid);failMsg(cid,'超时')}},10000);
  inp.value='';lastTyp=0;grow();if(!TOUCH)inp.focus()}
f.onsubmit=e=>{e.preventDefault();submit()};
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!TOUCH){e.preventDefault();submit()}});
inp.enterKeyHint=TOUCH?'enter':'send';

/* ---------- emoji ---------- */
const emo=$('#emo');emo.innerHTML=EMO.map(e=>`<button type="button" role="option" aria-label="${e}">${e}</button>`).join('');
$('#emob').onclick=()=>{const o=!emo.classList.contains('on');emo.classList.toggle('on',o);$('#emob').setAttribute('aria-expanded',o);fh()};
emo.onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=inp.selectionStart??inp.value.length,en=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.textContent+inp.value.slice(en);const p=s+b.textContent.length;grow();if(!TOUCH){inp.focus();inp.setSelectionRange(p,p)}};
document.addEventListener('click',e=>{if(emo.classList.contains('on')&&!e.target.closest('#emo,#emob')){emo.classList.remove('on');$('#emob').setAttribute('aria-expanded','false');fh()}});

/* ---------- views & sheets ---------- */
function meBtn(){const b=$('#me');b.textContent=ini(me.nick);b.style.cssText=avc(me.uid||key);b.title='我是 '+me.nick+'（点击修改昵称）';b.setAttribute('aria-label','我的昵称：'+me.nick+'，点击修改')}
function openDM(uid,nick){if(!uid||uid===me.uid)return;const c=dms[uid]||(dms[uid]={nick,msgs:[],loaded:false,unread:0});if(nick)c.nick=nick;
  view=uid;pubUnread=0;$('#dmname').textContent=c.nick||'匿名';$('#dmbar').classList.add('on');inp.placeholder='私信 '+(c.nick||'');closeSheet();typers.clear();typingPaint();
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'dmhist',with:uid}));render();markSeen(uid);fh()}

$('#dmback').onclick=lobby;
function openSheet(k,html,left){const p=$('#pan');p.dataset.k=k;p.className='pan'+(left?' left':'');p.innerHTML=html;$('#sheet').classList.add('on');const b=p.querySelector('input,button');b&&b.focus({preventScroll:true})}
function closeSheet(){$('#sheet').classList.remove('on')}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();emo.classList.remove('on')}});
function userItem(u,sub,extra){return `<button class="it" type="button" data-u="${esc(u.uid)}" data-n="${esc(u.nick)}"><span class="av" style="${avc(u.uid)}">${esc(ini(u.nick))}</span><span class="tx"><b>${esc(u.nick)}</b>${sub?`<small>${sub}</small>`:''}</span>${extra||''}</button>`}

function userMenu(uid,nick){if(uid===me.uid)return nickSheet();
  openSheet('u',`${userItem({uid,nick},online.users.some(u=>u.uid===uid)?'在线':'不在线也能收到私信')}<div class="acts2"><button type="button" class="pri" data-a="dm">私信</button><button type="button" data-a="at">@ 提及</button></div>`);
  $('#pan').querySelector('.it').disabled=true;
  $('#pan').querySelector('[data-a=dm]').onclick=()=>openDM(uid,nick);
  $('#pan').querySelector('[data-a=at]').onclick=()=>{closeSheet();if(view)lobby();inp.value=(inp.value&&!/\s$/.test(inp.value)?inp.value+' ':inp.value)+'@'+nick+' ';grow();inp.focus()}}
function sheetDM(){const list=Object.entries(dms).filter(([,c])=>c.last||c.msgs.length).sort((a,b)=>((b[1].last||{}).ts||0)-((a[1].last||{}).ts||0));
  openSheet('dm','<h3><span>私信</span></h3>'+(list.length?list.map(([uid,c])=>{const l=c.last||c.msgs[c.msgs.length-1]||{};return userItem({uid,nick:c.nick||'匿名'},esc((l.uid===me.uid?'我：':'')+(l.text||'')).slice(0,60)+(l.ts?' · '+rel(l.ts):''),c.unread?`<span class="u">${c.unread}</span>`:'')}).join(''):'<div class="none">还没有私信。<br>点「当前在线」里的人或聊天里的头像，就可以私聊。</div>'))}
function nickSheet(){openSheet('nick',`<h3><span>修改昵称</span></h3><input id="nn" maxlength="16" value="${esc(me.nick)}" aria-label="新昵称"><div class="hint">1–16 个字，所有人可见。</div><div class="acts2"><button type="button" data-a="rand">随机一个</button><button type="button" class="pri" data-a="ok">保存</button></div>`);
  const nn=$('#nn');nn.select();
  const ok=()=>{const v=nn.value.trim().replace(/\s+/g,' ');if(!v||[...v].length>16)return toast('昵称需要 1–16 个字');if(v===me.nick)return closeSheet();
    if(ws&&ws.readyState===1){ws.send(JSON.stringify({t:'nick',nick:v}));closeSheet()}else{me.nick=v;LS.set('chatNick',v);meBtn();closeSheet();toast('连上后会使用新昵称')}};
  $('#pan').querySelector('[data-a=ok]').onclick=ok;nn.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok()}};
  $('#pan').querySelector('[data-a=rand]').onclick=()=>{nn.value=pick(A)+pick(B);nn.focus()}}
$('#on').onclick=()=>{if(ws&&ws.readyState===1)sheetOnline();else if(!ws){fatal=false;tries=0;connect()}};
$('#dmb').onclick=sheetDM;$('#me').onclick=nickSheet;
$('#pan').addEventListener('click',e=>{const it=e.target.closest('.it[data-u]');if(!it||it.disabled)return;const k=$('#pan').dataset.k;
  if(k==='dm')openDM(it.dataset.u,it.dataset.n);else if(k==='on')userMenu(it.dataset.u,it.dataset.n)});
inner.addEventListener('click',e=>{const a=e.target.closest('[data-u]');if(a&&!view)userMenu(a.dataset.u,a.dataset.n)});
$('#clr').onclick=()=>{if(view){toast('清屏只作用于大厅');return}clearTs=Date.now();LS.set('chatClear',String(clearTs));render();toast('已清屏，只对你自己生效')};

/* ---------- layout: keep the "new messages" pill above the input; keyboard on phones ---------- */
function fh(){document.body.style.setProperty('--fh',f.offsetHeight+'px')}
new ResizeObserver(fh).observe(f);
inp.addEventListener('focus',()=>{if(TOUCH)document.documentElement.classList.add('kb');setTimeout(()=>{if(near())down()},300)});
