/* ================= conversation history: kept on this device (localStorage), several sessions =================

   st: 'partial' (saved mid-stream) | 'stopped' (stopped / interrupted). The server keeps its own log (see /privacy); there is no

  catch(e){const full=/quota|exceed/i.test((e&&e.name||'')+(e&&e.message||''));
   const others=d.list.filter(s=>!cv||s.id!==cv.id);
   if(full&&others.length){d.list.splice(d.list.indexOf(others[others.length-1]),1);continue}

    full+=queue;queue='';w.removeAttribute('aria-busy');
    const why=timedOut?'等待回答超时（90 秒没有新内容）':e.name==='AbortError'?'':(e.message||'网络错误');
    if(full){cancelAnimationFrame(timer);paint();w.classList.remove('typing','wait');finishOk('stopped');if(why&&conv===cv)failBar('回答中断：'+why+'。可以点「重新生成」再试一次',true)}
    else{cancelAnimationFrame(timer);w.remove();if(conv===cv){persist();failBar(why?why:'已停止生成');say(why||'已停止')}}}
  finally{if(ctrl===myCtrl)ctrl=null;busy=false;send.innerHTML=SEND;send.classList.remove('stop');send.setAttribute('aria-label','发送');grow()}}
showModel();grow();
/* keyboard open on phones: let the input sit right above the keyboard */
const TOUCH=matchMedia('(hover:none)').matches;
inp.addEventListener('focus',()=>{if(TOUCH)document.documentElement.classList.add('kb');setTimeout(down,300)});
inp.addEventListener('blur',()=>document.documentElement.classList.remove('kb'));
addEventListener('message',e=>{if(e.data&&e.data.type==='tab-shown'&&matchMedia('(hover:hover)').matches)inp.focus()});
window.__astra={get cv(){return cv},persist,readDB};
})();
