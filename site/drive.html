const DOC='doc docx xls xlsx ppt pptx pdf txt md csv key pages numbers rtf epub';
const catOf=n=>{const k=kindOf(n),e=ext(n);if(k==='img'||k==='video'||k==='audio')return k;if(k==='pdf'||k==='text'||DOC.split(' ').includes(e))return 'doc';return 'other'};
const bigIcon=n=>{const e=ext(n);return ICON[kindOf(n)]||({zip:'🗜️',rar:'🗜️','7z':'🗜️',gz:'🗜️',apk:'🤖',exe:'🪟',dmg:'💿',iso:'💿',doc:'📘',docx:'📘',xls:'📗',xlsx:'📗',ppt:'📙',pptx:'📙'}[e])||'📦'};
function fileTile(f,showDir){const k=kindOf(f.name),u='/api/files/raw/'+enc(f.path);let th;
 if(k==='img'&&ext(f.name)!=='heic')th=`<img loading="lazy" decoding="async" src="${u}" alt="">`;
 else if(k==='video')th=`<video preload="metadata" muted playsinline src="${u}#t=0.1"></video><div class="play"><span>▶</span></div>`;
 else th=`<span class="big">${bigIcon(f.name)}</span>`;
 return `<li class="${k?'':'dl-only'}" data-p="${esc(f.path)}"><div class="th">${th}<span class="ext">${esc(ext(f.name).slice(0,5)||'file')}</span></div><div class="meta"><b title="${esc(f.name)}">${esc(f.name)}</b><small>${showDir&&f.dir?esc(f.dir)+' · ':''}${fmt(f.size)}</small>${tagHtml(f)}</div></li>`}
function folderTile(d,label,sub){return `<li class="fd" data-d="${esc(d)}"><div class="th"><span class="big">${label==='..'?'↩︎':'📁'}</span></div><div class="meta"><b>${label==='..'?'返回上一级':esc(label)}</b><small>${sub}</small></div></li>`}
function fileRow(f,showDir){if(view==='grid')return fileTile(f,showDir);return `<li><div class="ico">${{img:'🖼️',video:'🎬',audio:'🎵',pdf:'📕',text:'📄'}[kindOf(f.name)]||'📦'}</div><div class="n"><b title="${esc(f.name)}">${esc(f.name)}</b><small>${showDir&&f.dir?'📁 '+esc(f.dir)+' · ':''}${fmt(f.size)}${f.date?' · '+new Date(f.date).toLocaleDateString():''}</small>${tagHtml(f)}</div><div class="acts">${kindOf(f.name)?`<button class="v" data-p="${esc(f.path)}">查看</button>`:''}<a class="d" href="/api/files/raw/${enc(f.path)}?dl=1" data-p="${esc(f.path)}">下载</a></div></li>`}
function render(){crumb();const q=$('#q').value.trim().toLowerCase(),L=$('#list');L.classList.toggle('grid',view==='grid');$$('#vt button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));$$('#cats button').forEach(b=>b.classList.toggle('on',b.dataset.c===cat));
 const fl=$('#filter');if(tagF){const f0=files.find(f=>f.tag===tagF);fl.innerHTML=`只看来源 ${f0&&f0.mine?'「我」':tagF} 上传的文件 · <button id="clr">显示全部</button>`;fl.classList.add('on')}else fl.classList.remove('on');
 if(q||tagF||cat){const v=files.filter(f=>(!q||f.name.toLowerCase().includes(q)||f.dir.toLowerCase().includes(q))&&(!tagF||f.tag===tagF)&&(!cat||catOf(f.name)===cat));
  const fd=q?folders.filter(x=>x.toLowerCase().includes(q)):[];
  L.innerHTML=(fd.map(d=>view==='grid'?folderTile(d,d.split('/').pop(),countIn(d)+' 个文件'):`<li class="fd" data-d="${esc(d)}"><div class="ico f">📁</div><div class="n"><b>${esc(d.split('/').pop())}</b><small>${esc(d)} · ${countIn(d)} 个文件</small></div></li>`).join('')+v.map(f=>fileRow(f,true)).join(''))||'<li class="empty">没有匹配的文件</li>';return}
 const sub=kids(cwd),v=files.filter(f=>inDir(f,cwd));
 const G=view==='grid';
 const up=cwd&&G?folderTile(cwd.includes('/')?cwd.slice(0,cwd.lastIndexOf('/')):'','..',''):cwd?`<li class="fd" data-d="${esc(cwd.includes('/')?cwd.slice(0,cwd.lastIndexOf('/')):'')}"><div class="ico">↩︎</div><div class="n"><b>返回上一级</b></div></li>`:'';
 const h=sub.map(d=>G?folderTile(d,d.split('/').pop(),countIn(d)+' 个文件'):`<li class="fd" data-d="${esc(d)}"><div class="ico f">📁</div><div class="n"><b>${esc(d.split('/').pop())}</b><small>${countIn(d)} 个文件</small></div></li>`).join('')+v.map(f=>fileRow(f,false)).join('');
 L.innerHTML=up+(h||'<li class="empty">'+(cwd?'这个文件夹还是空的，上传的文件会放到这里':'还没有文件，来上传第一个吧')+'</li>')}
function cd(d){cwd=d;sessionStorage.setItem('cwd',d);$('#q').value='';render();window.scrollTo({top:Math.max(0,$('.bar2').offsetTop-20),behavior:'smooth'})}
$('#crumb').onclick=e=>{const b=e.target.closest('button[data-d]');if(b)cd(b.dataset.d)};
$('#cats').onclick=e=>{const b=e.target.closest('button[data-c]');if(b){cat=b.dataset.c;render()}};
$('#vt').onclick=e=>{const b=e.target.closest('button[data-v]');if(b){view=b.dataset.v;localStorage.setItem('driveView',view);render()}};
$('#filter').onclick=e=>{if(e.target.id==='clr'){tagF='';render()}};
$('#mk').onclick=async()=>{const n=prompt('新文件夹名称'+(cwd?'（建在「'+cwd+'」里）':''));if(!n||!n.trim())return;
 const r=await fetch('/api/folders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:(cwd?cwd+'/':'')+n.trim()})});const j=await r.json().catch(()=>({}));
 if(!r.ok){say(j.error||'创建失败','err');return}say('已创建文件夹 '+j.path.split('/').pop(),'ok');if(!folders.includes(j.path))folders.push(j.path);cd(j.path);load()};
async function load(){try{const r=await fetch('/api/files',{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error);files=j.files;folders=j.folders||[];if(cwd&&!folders.includes(cwd)&&!files.some(f=>f.dir===cwd||f.dir.startsWith(cwd+'/')))cwd='';$('#quota').textContent='已用 '+fmt(j.used)+' / '+j.cap;render()}catch(e){$('#list').innerHTML='<li class="empty">加载失败：'+esc(e.message||'')+'</li>'}}
const sig=async p=>{const r=await fetch('/api/files/url/'+enc(p),{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'获取链接失败');return j};

/* ---------- upload: hash in browser, PUT straight to Hugging Face storage ---------- */
async function hashFile(f,prog){
 if(f.size<=256*1048576&&crypto.subtle){prog(0,'计算校验…');const b=await f.arrayBuffer();const d=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 const h=new Sha256(),CH=8*1048576;for(let o=0;o<f.size;o+=CH){h.update(new Uint8Array(await f.slice(o,o+CH).arrayBuffer()));prog(o/f.size,'计算校验 '+Math.round(o/f.size*100)+'%');await new Promise(r=>setTimeout(r))}return h.hex()}
let relay=false;
function xput(url,body,headers,onp,viaRelay){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('PUT',viaRelay?'/api/up/part':url);for(const k in headers||{})x.setRequestHeader(k,headers[k]);if(viaRelay)x.setRequestHeader('x-target',url);
 x.upload.onprogress=e=>onp&&onp(e.loaded);x.onload=()=>{if(x.status>=300)return rej(new Error('存储返回 '+x.status));res(viaRelay?JSON.parse(x.responseText).etag:x.getResponseHeader('ETag'))};x.onerror=()=>rej(Object.assign(new Error('网络错误'),{net:1}));x.send(body)})}
async function put(url,body,headers,onp){if(!relay){try{return await xput(url,body,headers,onp,false)}catch(e){if(!e.net)throw e;relay=true}}return xput(url,body,headers,onp,true)}
async function up(f){
 const row=document.createElement('div');row.className='up';row.innerHTML=`<span></span><div class="bar3"><i></i></div>`;$('#ups').prepend(row);
 const txt=row.firstChild,bar=row.querySelector('i'),set=(p,t)=>{bar.style.width=(p*100).toFixed(1)+'%';txt.textContent=f.name+' · '+t};
 try{
  if(!f.size)throw new Error('空文件');
  const oid=await hashFile(f,(p,t)=>set(p*.1,t));
  let r=await fetch('/api/up/init',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:f.name,size:f.size,oid,dir:cwd})});let pl=await r.json();if(!r.ok)throw new Error(pl.error);
  const t0=performance.now(),spd=done=>{const s=done/((performance.now()-t0)/1000||1);return fmt(s)+'/s'};
  const fin={path:pl.path,oid,size:f.size,verify:pl.verify};
  if(pl.mode==='basic'){await put(pl.href,f,pl.header,l=>set(.1+.88*l/f.size,'上传 '+Math.round(l/f.size*100)+'% · '+spd(l)))}
  else if(pl.mode==='multipart'){const n=pl.parts.length,done=new Array(n).fill(0),etags=new Array(n);let next=0;
   const worker=async()=>{for(;;){const i=next++;if(i>=n)return;const a=i*pl.chunk,b=Math.min(f.size,a+pl.chunk);let tries=0;
     for(;;){try{etags[i]=await put(pl.parts[i],f.slice(a,b),{},l=>{done[i]=l;const s=done.reduce((x,y)=>x+y,0);set(.1+.88*s/f.size,'上传 '+Math.round(s/f.size*100)+'% · '+spd(s))});break}catch(e){if(++tries>=3)throw e}}}};
   await Promise.all(Array.from({length:Math.min(4,n)},worker));
   fin.complete=pl.complete;fin.parts=etags.map((e,i)=>({partNumber:i+1,etag:e}))}
  set(.99,'保存中…');
  r=await fetch('/api/up/finish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(fin)});const j=await r.json();if(!r.ok)throw new Error(j.error);
  set(1,'上传成功 ✓');row.className='up ok';load();setTimeout(()=>row.remove(),6000);
 }catch(e){row.className='up err';txt.textContent=f.name+' · 失败：'+e.message}}
const many=fl=>{[...fl].reduce((p,f)=>p.then(()=>up(f)),Promise.resolve())};
$('#file').onchange=e=>{many(e.target.files);e.target.value=''};
const d=$('#drop');['dragenter','dragover'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.add('over')}));
['dragleave','drop'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.remove('over')}));d.addEventListener('drop',e=>many(e.dataTransfer.files));
$('#q').oninput=render;

/* ---------- fast download straight from the CDN ---------- */
function download(p,name){const a=document.createElement('a');a.href='/api/files/raw/'+enc(p)+'?dl=1';a.download=name;document.body.appendChild(a);a.click();a.remove();say('开始下载：'+name,'ok')}

/* ---------- online preview ---------- */
const pv=$('#pv'),pvb=$('#pvb');let cur=null;
function closePv(){window.__post&&__post({type:'bar',show:true});pv.classList.remove('open');pvb.innerHTML='';document.documentElement.style.overflow=''}
$('#pvx').onclick=closePv;addEventListener('keydown',e=>{if(e.key==='Escape')closePv()});
$('#pvd').onclick=()=>cur&&download(cur.path,cur.name);
const view_=f=>view2(f);
async function view2(f){cur=f;window.__post&&__post({type:'bar',show:false});$('#pvn').textContent=f.name;pvb.innerHTML='<div class="na">加载中…</div>';pv.classList.add('open');document.documentElement.style.overflow='hidden';
 try{const s={url:'/api/files/raw/'+enc(f.path)},k=kindOf(f.name);
  if(k==='img'){pvb.innerHTML=`<img src="${esc(s.url)}" alt="">`;pvb.querySelector('img').onerror=()=>{pvb.innerHTML='<div class="na">图片加载失败'+(ext(f.name)==='heic'?'（HEIC 只有 Safari 能显示）':'')+'</div>'}}
  else if(k==='video'){pvb.innerHTML=`<video src="${esc(s.url)}" controls playsinline preload="metadata"></video>`;pvb.querySelector('video').onerror=()=>{pvb.innerHTML='<div class="na">这个视频格式当前浏览器无法播放'+(ext(f.name)==='mov'?'（.mov 在 Safari 里最稳）':'')+'<br>可以下载后观看</div>'}}
  else if(k==='audio')pvb.innerHTML=`<audio src="${esc(s.url)}" controls preload="metadata"></audio>`;
  else if(k==='pdf')pvb.innerHTML=`<iframe src="${esc(s.url)}" title="PDF"></iframe>`;
  else if(k==='text'){const r=await fetch(s.url,{headers:{Range:'bytes=0-2097151'}});const t=await r.text();const pre=document.createElement('pre');pre.textContent=t+(f.size>2097152?'\n\n…（只显示前 2MB，完整内容请下载）':'');pvb.innerHTML='';pvb.appendChild(pre)}
  else pvb.innerHTML='<div class="na">这种文件暂不支持在线查看<br>请下载后打开</div>';
 }catch(e){pvb.innerHTML='<div class="na">'+esc(e.message)+'</div>'}}

$('#list').onclick=e=>{const t=e.target;
 const tg=t.closest('.tag');if(tg){tagF=tg.dataset.tag;render();return}
 const fd=t.closest('li.fd');if(fd){cd(fd.dataset.d);return}
 if(view==='grid'){const li=t.closest('li[data-p]');if(li){const f=files.find(x=>x.path===li.dataset.p);if(!f)return;kindOf(f.name)?view_(f):download(f.path,f.name);return}}
 const p=t.dataset&&t.dataset.p;if(!p)return;const f=files.find(x=>x.path===p);
 if(t.matches('button.v')){view2(f);return}
 if(t.matches('a.d')){e.preventDefault();download(p,f.name);return}};
load();
})();

</script>
